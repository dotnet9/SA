<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个股 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .m-quote {
    position: sticky; top: 0; z-index: 15;
    background: var(--bg-glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 10px 16px 10px;
  }
  /* 移动端 Tab 条：横向滚动，不换行 */
  #mStockPane .stock-tabs { padding: 8px 16px 10px; background: var(--bg-root); }
  #mStockPane .stock-pane-head { margin: 0 16px 8px; padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
  #mStockPane .stock-pane-head .stock-back { display: none; }
  #mStockPane > div:not(.stock-tabs):not(#stockPaneHead) { padding: 0 16px 20px; }
</style>
</head>
<body data-page="stock" data-title="个股" data-desc="吸顶行情条 + 9 个 Tab（横向滚动）。明细数据只内置了主演示股，其它标的显示概览。">
<div id="appScreen">

  <div class="m-quote">
    <div class="row-between">
      <div class="row gap-2">
        <span class="fs-16" style="font-weight:700" id="mName">宁德时代</span>
        <span class="mono fs-12 t-3" id="mCode">300750</span>
      </div>
      <button class="icon-btn" style="margin-right:-8px" id="mStar">☆</button>
    </div>
    <div class="row" style="gap:12px;margin-top:4px">
      <span class="mono fs-26 fw-700" id="mPrice" style="letter-spacing:-0.02em">268.42</span>
      <span class="col" style="gap:1px">
        <span class="mono fs-13" id="mPct">+4.86%</span>
      </span>
    </div>
  </div>

  <!-- 个股区：与桌面端共用同一份控制器与面板 -->
  <div class="stock-pane is-active" id="mStockPane"></div>

</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/spec.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/stock-panels.js"></script>
<script src="../web/_shared/panels/overview.js"></script>
<script src="../web/_shared/panels/trend.js"></script>
<script src="../web/_shared/panels/finance.js"></script>
<script src="../web/_shared/panels/equity.js"></script>
<script src="../web/_shared/panels/capital.js"></script>
<script src="../web/_shared/panels/industry.js"></script>
<script src="../web/_shared/panels/events.js"></script>
<script src="../web/_shared/panels/risk.js"></script>
<script src="../web/_shared/panels/rating.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA;

  /* URL 还原优先（从大盘/自选点进来会带 ?code=），否则用主演示股 */
  var m = /[?&]code=([^&#]+)/.exec(window.location.search || "");
  var code = m ? decodeURIComponent(m[1]) : ((D.meta && D.meta.focus) || "300750");
  var tab = (window.location.hash || "").replace("#", "") || "overview";

  var s = (D.allStockByCode && D.allStockByCode[code]) || (D.stockByCode && D.stockByCode[code]) || null;

  /* 吸顶行情条：只放 名称 / 代码 / 现价 / 涨跌幅 */
  if (s) {
    document.getElementById("mName").textContent = s.name;
    document.getElementById("mCode").textContent = s.code;
    var cls = s.pct >= 0 ? "t-up" : "t-down";
    var priceEl = document.getElementById("mPrice");
    priceEl.textContent = s.price.toFixed(2);
    priceEl.className = "mono fs-26 fw-700 " + cls;
    var pctEl = document.getElementById("mPct");
    pctEl.textContent = (s.pct >= 0 ? "+" : "") + s.pct.toFixed(2) + "%";
    pctEl.className = "mono fs-13 " + cls;
  }

  window.SA_PANE.mount("#mStockPane", null);
  window.SA_PANE.open(code, tab);

  document.getElementById("mStar").addEventListener("click", function () {
    this.textContent = "★";
    SA.toast("已加入自选", "ok");
  });

  if (s) SA.startLiveTicker("#mPrice", { interval: 3000 });
})();
</script>
</body>
</html>
