<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提醒规则 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .rule-card {
    border-radius: 14px; padding: 14px;
    background: var(--bg-panel);
  }
  [data-theme="light"] .rule-card { box-shadow: 0 1px 3px rgba(20, 22, 26, 0.05); }
  .rule-card.is-off { opacity: .55; }
  .type-tile {
    border-radius: 14px; padding: 14px;
    background: var(--bg-panel); text-align: center;
  }
  .type-tile.is-active { background: var(--brand-soft); }
  .type-tile.is-active .fs-12 { color: var(--brand); }
</style>
</head>
<body data-page="alerts" data-title="提醒规则" data-desc="规则卡片 + 开关是主角，新建规则走全屏分步页。模板压成一行标签，触发历史只留最近两条。">
<div id="appScreen">

  <div class="m-topbar">
    <span class="m-title">提醒</span>
    <span class="row gap-2" style="margin-left:auto"><span class="dot dot-live"></span><span class="fs-11 t-3">巡检中</span></span>
    <button class="icon-btn" data-open="fullNew">＋</button>
  </div>

  <div class="m-page">

    <!-- 筛选 -->
    <div class="row gap-2 wrap" id="mFilters">
      <span class="tag tag-lg tag-brand" id="fAll">全部</span>
      <span class="tag tag-lg tag-outline" id="fOn">仅启用</span>
      <span class="tag tag-lg tag-outline" id="fOff">仅停用</span>
      <span class="tag tag-lg tag-outline" id="fTest">测试通知</span>
    </div>

    <!-- 规则列表 -->
    <div class="col gap-2" style="margin-top:14px" id="mRules"></div>

    <!-- 模板 -->
    <div class="m-section-title">从模板新建</div>
    <div class="row gap-2 wrap">
      <span class="tag tag-lg tag-outline tplBtn" data-t="趋势转弱三连">趋势转弱三连</span>
      <span class="tag tag-lg tag-outline tplBtn" data-t="突破确认">突破确认</span>
      <span class="tag tag-lg tag-outline tplBtn" data-t="资金异动">资金异动</span>
      <span class="tag tag-lg tag-outline tplBtn" data-t="事件驱动">事件驱动</span>
    </div>

    <!-- 触发历史 -->
    <div class="m-section-title">最近触发</div>
    <div class="col gap-2" id="mHist"></div>

    <div class="hint" style="margin-top:20px;line-height:1.8">
      价格类每 30 秒巡检 · 演示数据 · 原型不实现真实推送
    </div>

  </div>
</div>

<div id="appActions" class="m-actions" style="display:none">
  <button class="btn btn-outline" href="notify-preview.html" id="mPreview">提醒形态</button>
  <button class="btn btn-primary" data-open="fullNew">新建规则</button>
</div>

<!-- 新建规则全屏页 -->
<div class="overlay" id="fullNew" style="padding:0;align-items:stretch">
  <div style="width:100%;height:100%;background:var(--bg-root);display:flex;flex-direction:column;border-radius:0">
    <div class="m-topbar">
      <button class="icon-btn" data-close="fullNew">✕</button>
      <span class="m-title">新建提醒规则</span>
      <button class="btn btn-sm btn-primary" style="margin-left:auto" data-close="fullNew" onclick="SA.toast('规则已保存并启用','ok')">保存</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:12px 20px 24px">

      <div class="m-section-title">1. 规则类型</div>
      <div class="grid grid-2" style="gap:10px">
        <div class="type-tile is-active" data-t="price"><div class="fs-13 fw-600">价格与涨跌幅</div></div>
        <div class="type-tile" data-t="tech"><div class="fs-13 fw-600">技术指标</div></div>
        <div class="type-tile" data-t="flow"><div class="fs-13 fw-600">资金流异动</div></div>
        <div class="type-tile" data-t="event"><div class="fs-13 fw-600">公告与事件</div></div>
      </div>
      <div class="hint mt-3" id="typeDesc">
        股价上穿/下穿指定价格、当日涨跌幅超阈值、创 N 日新高/新低。
      </div>

      <div class="m-section-title">2. 股票与范围</div>
      <div class="field">
        <label class="label">股票</label>
        <input class="input tap-44" value="宁德时代 300750">
      </div>
      <div class="field mt-3">
        <label class="label">应用范围</label>
        <select class="select tap-44">
          <option>仅这一只股票</option>
          <option>应用到「核心持仓」分组（4 只）</option>
          <option>应用到全部自选股（14 只）</option>
        </select>
      </div>

      <div class="m-section-title">3. 触发条件</div>
      <div class="field">
        <label class="label">条件</label>
        <select class="select tap-44">
          <option>上穿</option><option>下穿</option><option>涨跌幅超过</option><option>创 N 日新高</option>
        </select>
      </div>
      <div class="field mt-3">
        <label class="label">阈值</label>
        <div class="row gap-2">
          <input class="input input-num tap-44" value="265.00">
          <span class="hint">元</span>
        </div>
      </div>

      <div class="m-section-title">4. 通知方式</div>
      <div class="col gap-2">
        <label class="check tap-44"><input type="checkbox" checked> 站内通知中心</label>
        <label class="check tap-44"><input type="checkbox" checked> 浏览器通知栏</label>
        <label class="check tap-44"><input type="checkbox" checked> 震动（iOS 不支持）</label>
      </div>

      <div class="m-section-title">5. 生效时间</div>
      <div class="segmented tap-44" style="width:100%">
        <span class="is-active">交易日 9:30–15:00</span><span>全天</span>
      </div>

      <div class="hint mt-4" style="line-height:1.8">
        预览：在交易日 9:30–15:00 内上穿 265.00 元时提醒，5 分钟内不重复。
      </div>

      <button class="btn btn-primary btn-block mt-4" style="height:48px;border-radius:14px" data-close="fullNew" onclick="SA.toast('规则已保存并启用','ok')">保存并启用</button>
    </div>
  </div>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA, al = D.alerts;
  var filter = "all";

  function render() {
    var list = al.rules.filter(function (r) {
      if (filter === "on") return r.status === "on";
      if (filter === "off") return r.status === "off";
      return true;
    });

    document.getElementById("mRules").innerHTML = list.map(function (r) {
      return '<div class="rule-card' + (r.status === "off" ? " is-off" : "") + '">' +
        '<div class="row gap-2">' +
          '<span class="fs-14 fw-600">' + r.name + "</span>" +
          '<label class="switch" style="margin-left:auto"><input type="checkbox"' + (r.status === "on" ? " checked" : "") + ' data-toggle="' + r.id + '"><span class="track"></span></label>' +
        "</div>" +
        '<div class="fs-13 t-2" style="margin-top:6px;line-height:1.7">' + r.desc + "</div>" +
        '<div class="row gap-3" style="margin-top:8px">' +
          '<span class="hint">触发 ' + r.triggers + " 次 · 最近 " + r.lastTrigger + "</span>" +
        "</div>" +
      "</div>";
    }).join("");

    SA.qsa("[data-toggle]").forEach(function (sw) {
      sw.addEventListener("change", function () {
        var r = al.rules.filter(function (x) { return x.id === sw.getAttribute("data-toggle"); })[0];
        r.status = sw.checked ? "on" : "off";
        SA.toast((sw.checked ? "已启用：" : "已停用：") + r.name, sw.checked ? "ok" : "warn");
        render();
      });
    });
  }
  render();

  [["fAll", "all"], ["fOn", "on"], ["fOff", "off"]].forEach(function (p) {
    document.getElementById(p[0]).addEventListener("click", function () {
      filter = p[1];
      ["fAll", "fOn", "fOff"].forEach(function (id) {
        var el = document.getElementById(id);
        el.classList.toggle("tag-brand", id === p[0]);
        el.classList.toggle("tag-outline", id !== p[0]);
      });
      render();
    });
  });
  document.getElementById("fTest").addEventListener("click", function () {
    SA.toast("已发送测试通知（站内 + 通知栏）", "ok");
  });

  /* 类型描述 */
  var DESC = {
    price: "股价上穿/下穿指定价格、当日涨跌幅超阈值、创 N 日新高/新低。",
    tech: "上穿/下穿 MA5/10/20/60、均线金叉死叉、MACD 金叉、放量突破。",
    flow: "主力净流入超阈值、北向持股变化、龙虎榜上榜、融资余额异动。",
    event: "定期报告、业绩预告、重大合同、股东增减持、监管函 / 问询函。"
  };
  SA.qsa(".type-tile").forEach(function (t) {
    t.addEventListener("click", function () {
      SA.qsa(".type-tile").forEach(function (o) { o.classList.toggle("is-active", o === t); });
      document.getElementById("typeDesc").textContent = DESC[t.getAttribute("data-t")];
    });
  });

  /* 触发历史：最近 2 条 */
  document.getElementById("mHist").innerHTML = al.history.slice(0, 2).map(function (h) {
    return '<div class="m-card">' +
      '<div class="row-between"><span class="fs-13 fw-600">' + h.name + " " + h.code + "</span>" +
      '<span class="mono fs-12 t-brand">' + h.value + "</span></div>" +
      '<div class="fs-12 t-2" style="margin-top:4px;line-height:1.7">' + h.rule + "</div>" +
      '<div class="hint" style="margin-top:4px">' + h.time + " · " + h.channel + "</div>" +
      "</div>";
  }).join("");

  SA.qsa(".tplBtn").forEach(function (b) {
    b.addEventListener("click", function () {
      SA.toast("已添加规则模板：" + b.getAttribute("data-t"), "ok");
    });
  });
  document.getElementById("mPreview").addEventListener("click", function () {
    window.location.href = "notify-preview.html";
  });
})();
</script>
</body>
</html>
