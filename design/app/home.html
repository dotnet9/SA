<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大盘概况 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .idx-card { flex: 0 0 132px; border-radius: 14px; padding: 12px; background: var(--bg-panel); }
  [data-theme="light"] .idx-card { box-shadow: 0 1px 3px rgba(20, 22, 26, 0.05); }
  .mkt-row { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); }
  .mkt-row:last-child { border-bottom: none; }
  .mkt-row .nm { flex: 1; min-width: 0; }
  .mkt-row .pc { width: 68px; text-align: right; }
</style>
</head>
<body data-page="home" data-title="大盘概况" data-desc="指数横滑 + 全市场列表（三列：名称、现价、涨跌幅）。点任一行进入个股页。">
<div id="appScreen">
  <div class="m-page">

    <div class="row-between">
      <div>
        <div style="font-size:22px;font-weight:700;letter-spacing:-0.01em">大盘概况</div>
        <div class="hint" style="margin-top:2px">09-18 周五 · 收盘</div>
      </div>
      <span class="row gap-2"><span class="dot dot-live"></span><span class="hint">15:00</span></span>
    </div>

    <!-- 指数横滑 -->
    <div class="m-scroll-x" id="idxRow" style="margin-top:14px"></div>

    <!-- 全市场 -->
    <div class="m-section-title">全市场 <span class="hint" id="mktCount"></span></div>
    <input class="input input-sm" id="mktFilter" type="search" placeholder="搜索代码 / 名称 / 拼音" style="margin-bottom:10px">
    <div class="m-card is-flush" style="padding:0">
      <div id="mktList"></div>
    </div>

    <div class="hint" style="margin-top:16px;line-height:1.8">演示数据 · 非实时 · 不构成投资建议</div>

  </div>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/spec.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA;

  /* 指数横滑：名称 + 点位 + 涨跌幅 */
  document.getElementById("idxRow").innerHTML = D.indices.map(function (ix) {
    var cls = ix.pct >= 0 ? "t-up" : "t-down";
    return '<div class="idx-card">' +
      '<div class="fs-12 t-2">' + ix.name + "</div>" +
      '<div class="mono fs-18 fw-700 ' + cls + '" style="margin-top:6px">' + ix.price.toFixed(2) + "</div>" +
      '<div class="mono fs-12 ' + cls + '">' + (ix.pct >= 0 ? "+" : "") + ix.pct.toFixed(2) + "%</div>" +
    "</div>";
  }).join("");

  /* 全市场：窄屏三列，最多列 60 条（原型不翻页） */
  var LIMIT = 60;
  function render(kw) {
    var k = (kw || "").trim().toLowerCase();
    var list = D.allStocks.filter(function (s) {
      if (!k) return true;
      return s.code.indexOf(k) >= 0 || s.name.toLowerCase().indexOf(k) >= 0 || (s.py || "").indexOf(k) >= 0;
    });

    document.getElementById("mktCount").textContent = "共 " + list.length + " 只";

    document.getElementById("mktList").innerHTML = list.slice(0, LIMIT).map(function (s) {
      var cls = s.pct >= 0 ? "t-up" : "t-down";
      return '<a class="mkt-row" href="stock.html?code=' + s.code + '">' +
        '<span class="nm"><span class="fs-13">' + s.name + '</span>' +
          '<span class="mono fs-11 t-3" style="margin-left:6px">' + s.code + "</span></span>" +
        '<span class="mono fs-13" style="width:64px;text-align:right">' + s.price.toFixed(2) + "</span>" +
        '<span class="mono fs-13 ' + cls + ' pc">' + (s.pct >= 0 ? "+" : "") + s.pct.toFixed(2) + "%</span>" +
      "</a>";
    }).join("");
  }

  document.getElementById("mktFilter").addEventListener("input", function () { render(this.value); });
  render("");
})();
</script>
</body>
</html>
