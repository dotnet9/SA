<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知中心 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .nt-card {
    border-radius: 14px; padding: 12px 14px;
    background: var(--bg-panel); display: flex; gap: 12px; position: relative;
  }
  [data-theme="light"] .nt-card { box-shadow: 0 1px 3px rgba(20, 22, 26, 0.05); }
  .nt-card.is-unread { background: var(--brand-soft); }
  .nt-dot {
    width: 28px; height: 28px; border-radius: 9px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 13px;
  }
  .nt-dot.is-up { background: var(--up-soft); color: var(--up); }
  .nt-dot.is-down { background: var(--down-soft); color: var(--down); }
</style>
</head>
<body data-page="notifications" data-title="通知中心" data-desc="通知列表是唯一主角：未读高亮、点击已读、全部已读。渠道状态压缩为三行小字，时效说明移至 Web 端。">
<div id="appScreen">

  <div class="m-topbar">
    <span class="m-title">通知</span>
    <span class="fs-12 t-brand" style="margin-left:auto" id="mUnread">4 未读</span>
    <button class="icon-btn" id="mReadAll">✓</button>
  </div>

  <div class="m-page">

    <!-- 分段 -->
    <div class="segmented" style="width:100%">
      <span class="is-active" data-v="unread">未读 4</span>
      <span data-v="all">全部 10</span>
      <span data-v="stock">按股票</span>
    </div>

    <!-- 列表 -->
    <div class="col gap-2" style="margin-top:12px" id="mList"></div>

    <!-- 渠道状态 -->
    <div class="hint" style="margin-top:20px;line-height:2">
      推送渠道：站内 ✓ · 通知栏 ✓ · 震动（iOS 不支持）·
      <a class="t-brand" href="notify-preview.html">查看提醒形态预览 →</a><br>
      演示数据 · 原型不实现真实推送
    </div>

  </div>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA;
  var list = D.notifications.map(function (n) { return Object.assign({}, n); });
  var mode = "unread";

  function card(n) {
    var isUp = n.level === "up";
    return '<div class="nt-card' + (n.read ? "" : " is-unread") + '" data-id="' + n.id + '">' +
      '<span class="nt-dot ' + (isUp ? "is-up" : "is-down") + '">' + (isUp ? "↑" : "↓") + "</span>" +
      '<div class="grow" style="min-width:0">' +
        '<div class="row gap-2"><span class="fs-14" style="font-weight:600">' + n.title + "</span>" +
        '<span class="mono fs-11 t-3" style="margin-left:auto">' + n.time.slice(11) + "</span></div>" +
        '<div class="fs-12 t-2" style="margin-top:4px;line-height:1.7">' + n.body + "</div>" +
        '<div class="fs-11 t-3" style="margin-top:6px">' + n.name + " " + n.code + " · " + n.rule + "</div>" +
      "</div></div>";
  }

  function render() {
    var unread = list.filter(function (n) { return !n.read; });
    document.getElementById("mUnread").textContent = unread.length + " 未读";

    if (mode === "stock") {
      var groups = {};
      list.forEach(function (n) { (groups[n.code] = groups[n.code] || { name: n.name, items: [] }).items.push(n); });
      document.getElementById("mList").innerHTML = Object.keys(groups).map(function (code) {
        var g = groups[code];
        var un = g.items.filter(function (n) { return !n.read; }).length;
        return '<div class="fold">' +
          '<div class="fold-head"><span class="fs-14 fw-600">' + g.name + "</span>" +
          '<span class="hint" style="margin-left:auto">' + g.items.length + " 条" + (un ? " · " + un + " 未读" : "") + "</span>" +
          '<span class="caret">▼</span></div>' +
          '<div class="fold-body col gap-2">' + g.items.map(card).join("") + "</div>" +
          "</div>";
      }).join("");
    } else {
      var rows = mode === "unread" ? unread : list;
      document.getElementById("mList").innerHTML = rows.length ? rows.map(card).join("")
        : '<div class="empty"><div class="em-icon">✓</div><div class="fs-13">没有未读通知</div></div>';
    }

    SA.qsa(".nt-card").forEach(function (el) {
      el.addEventListener("click", function () {
        var n = list.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
        n.read = true;
        render();
        SA.toast("已读 · " + n.title, "info");
      });
    });
    SA.qsa(".fold-head").forEach(function (h) {
      h.addEventListener("click", function () { h.parentNode.classList.toggle("is-collapsed"); });
    });
  }

  SA.qsa(".segmented > *").forEach(function (el) {
    el.addEventListener("click", function () {
      SA.qsa(".segmented > *").forEach(function (o) { o.classList.toggle("is-active", o === el); });
      mode = el.getAttribute("data-v");
      render();
    });
  });

  document.getElementById("mReadAll").addEventListener("click", function () {
    list.forEach(function (n) { n.read = true; });
    render();
    SA.toast("已全部标记为已读", "ok");
  });

  render();
})();
</script>
</body>
</html>
