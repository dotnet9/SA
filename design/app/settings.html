<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .me-head {
    border-radius: 16px; padding: 20px;
    background: var(--bg-panel);
  }
  [data-theme="light"] .me-head { box-shadow: 0 1px 3px rgba(20, 22, 26, 0.05); }
  .me-row {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 0; border-bottom: 1px solid var(--border-soft); min-height: 50px;
  }
  .me-row:last-child { border-bottom: none; }
</style>
</head>
<body data-page="settings" data-title="我的" data-desc="账号 + 我的数据 + 外观 + 推送 + 关于。砍掉账号统计、指标参数、免打扰与数据口径等低频内容，设置回归少数高频项。">
<div id="appScreen">
  <div class="m-topbar">
    <span class="m-title">我的</span>
  </div>

  <div class="m-page">

    <!-- 账号 -->
    <div class="me-head">
      <div class="row gap-3">
        <span class="avatar" style="width:48px;height:48px;font-size:17px">管</span>
        <div class="grow">
          <div class="fs-16 fw-700">管理员</div>
          <div class="hint">admin · 全部功能点</div>
        </div>
      </div>
    </div>

    <!-- 我的数据 -->
    <div class="m-section-title">我的数据</div>
    <div class="m-card" style="padding:0 16px">
      <a class="me-row" href="watchlist.html"><span class="fs-14 grow">自选股</span><span class="mono fs-12 t-2">14 只</span><span class="t-3">›</span></a>
      <a class="me-row" href="screener.html"><span class="fs-14 grow">保存的选股策略</span><span class="mono fs-12 t-2">6 个</span><span class="t-3">›</span></a>
      <a class="me-row" href="alerts.html"><span class="fs-14 grow">提醒规则</span><span class="mono fs-12 t-2">10 条</span><span class="t-3">›</span></a>
      <a class="me-row" href="notifications.html"><span class="fs-14 grow">通知中心</span><span class="tag tag-brand">4 未读</span><span class="t-3">›</span></a>
    </div>

    <!-- 外观 -->
    <div class="m-section-title">外观</div>
    <div class="m-card">
      <div class="field">
        <label class="label">主题</label>
        <div class="segmented tap-44" style="width:100%" id="mTheme">
          <span class="is-active" data-v="dark">深色</span>
          <span data-v="light">浅色</span>
        </div>
      </div>
      <div class="field mt-3">
        <label class="label">涨跌颜色</label>
        <div class="segmented tap-44" style="width:100%" id="mUpdown">
          <span class="is-active" data-v="red-up">红涨绿跌</span>
          <span data-v="green-up">绿涨红跌</span>
        </div>
      </div>
    </div>

    <!-- 推送 -->
    <div class="m-section-title">推送</div>
    <div class="m-card">
      <div class="field">
        <label class="label">自选股推送间隔</label>
        <select class="select tap-44">
          <option>3 秒（推荐）</option><option>5 秒</option><option>10 秒</option><option>关闭实时推送</option>
        </select>
      </div>
      <label class="switch tap-44 mt-3"><input type="checkbox" checked><span class="track"></span>仅 WiFi 下推送（省流量）</label>
    </div>

    <!-- 安装 -->
    <div class="m-section-title">安装</div>
    <div class="m-card">
      <button class="btn btn-primary btn-block" style="height:44px;border-radius:12px" id="mInstall">安装到主屏</button>
      <button class="btn btn-outline btn-block mt-2" style="height:44px" id="mTestNotify">发送测试通知</button>
      <div class="hint" style="margin-top:10px;line-height:1.8">
        iOS 需用 Safari「添加到主屏幕」后才可申请通知权限；iOS 不支持震动。
      </div>
    </div>

    <!-- 关于 -->
    <div class="m-section-title">关于</div>
    <div class="m-card" style="padding:0 16px">
      <div class="me-row"><span class="fs-14 grow t-2">版本</span><span class="mono fs-12 t-2">原型 v0.1</span></div>
      <div class="me-row"><span class="fs-14 grow t-2">技术栈</span><span class="fs-12 t-2">ASP.NET Core · React · ECharts</span></div>
      <div class="me-row"><span class="fs-14 grow t-2">移动端</span><span class="fs-12 t-2">响应式 Web + PWA</span></div>
      <a class="me-row" href="styleguide-mobile.html"><span class="fs-14 grow t-2">移动端设计规范</span><span class="t-3">›</span></a>
    </div>

    <button class="btn btn-danger btn-block mt-4" style="height:48px;border-radius:14px" id="mLogout">退出登录</button>
    <div class="hint" style="margin-top:16px;text-align:center">
      演示数据 · 不构成投资建议
    </div>

  </div>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/spec.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  /* 主题 */
  SA.qsa("#mTheme > *").forEach(function (el) {
    el.addEventListener("click", function () {
      SA.set(SA.LS.theme, el.getAttribute("data-v"));
      SA.applyTheme();
      SA.qsa("#mTheme > *").forEach(function (o) { o.classList.toggle("is-active", o === el); });
    });
  });
  /* 涨跌色 */
  SA.qsa("#mUpdown > *").forEach(function (el) {
    el.addEventListener("click", function () {
      SA.set(SA.LS.updown, el.getAttribute("data-v"));
      SA.applyTheme();
      SA.qsa("#mUpdown > *").forEach(function (o) { o.classList.toggle("is-active", o === el); });
      SA.toast("涨跌色已切换", "info");
    });
  });
  var theme = SA.get(SA.LS.theme, "dark");
  SA.qsa("#mTheme > *").forEach(function (o) { o.classList.toggle("is-active", o.getAttribute("data-v") === theme); });
  var ud = SA.get(SA.LS.updown, "red-up");
  SA.qsa("#mUpdown > *").forEach(function (o) { o.classList.toggle("is-active", o.getAttribute("data-v") === ud); });

  document.getElementById("mInstall").addEventListener("click", function () {
    SA.toast("请用浏览器菜单或分享按钮「添加到主屏幕」", "info");
  });
  document.getElementById("mTestNotify").addEventListener("click", function () {
    if (window.Notification && Notification.permission === "granted") {
      try {
        new Notification("股析 SA · 测试通知", { body: "这是一条演示通知，用于验证通知渠道是否可用。" });
        SA.toast("已发送浏览器通知", "ok");
        return;
      } catch (e) { }
    }
    SA.toast("未获得通知权限，已改为站内通知（演示）", "warn");
  });
  document.getElementById("mLogout").addEventListener("click", function () {
    SA.toast("已退出登录", "info");
    setTimeout(function () { window.location.href = "index.html"; }, 500);
  });
})();
</script>
</body>
</html>
