<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自选股盯盘 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .wl-row {
    position: relative; overflow: hidden; background: var(--bg-panel);
  }
  .wl-row + .wl-row { margin-top: 2px; }
  .wl-inner {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; min-height: 64px;
    background: var(--bg-panel); position: relative; z-index: 2;
    transition: transform var(--t-base);
  }
  .wl-row:first-child .wl-inner { border-radius: 16px 16px 0 0; }
  .wl-row:last-child .wl-inner { border-radius: 0 0 16px 16px; }
  .wl-actions {
    position: absolute; right: 0; top: 0; bottom: 0; z-index: 1;
    display: flex;
  }
  .wl-actions > * {
    width: 68px; display: grid; place-items: center; color: #fff; font-size: 12px;
  }
  .swipe-hint { font-size: 10px; color: var(--text-3); }
</style>
</head>
<body data-page="watchlist" data-title="自选股盯盘" data-desc="大盘窄条 + 分组筛选 + 纯净列表（名称 / 价格 / 涨跌幅），实时刷新闪烁，左滑删除、长按拖拽排序。小屏上价格与涨跌就是全部。">
<div id="appScreen">

  <div class="m-topbar">
    <span class="m-title">自选</span>
    <span class="row gap-2" style="margin-left:auto"><span class="dot dot-live"></span><span class="fs-11 t-3">实时 3s</span></span>
    <button class="icon-btn" id="mPause">⏸</button>
  </div>

  <div class="m-page">

    <!-- 大盘窄条 -->
    <div class="statbar" style="margin-bottom:12px">
      <span class="statbar-item"><span class="k">上证</span><span class="v t-up">3286.42 +0.45%</span></span>
      <span class="statbar-item"><span class="k">创业板</span><span class="v t-up">2148.66 +1.24%</span></span>
      <span class="statbar-item"><span class="k">北向</span><span class="v t-up">+42.6 亿</span></span>
    </div>

    <!-- 分组 -->
    <div class="m-scroll-x" style="margin-bottom:12px" id="mGroups">
      <span class="tag tag-lg tag-brand" data-g="all">全部 14</span>
      <span class="tag tag-lg tag-outline" data-g="core">核心持仓 4</span>
      <span class="tag tag-lg tag-outline" data-g="watch">重点观察 6</span>
      <span class="tag tag-lg tag-outline" data-g="chain">产业链 4</span>
    </div>

    <!-- 列表 -->
    <div id="mList"></div>

    <div class="hint" style="margin-top:20px;line-height:1.8">
      仅自选股享受 3 秒实时推送 · 左滑删除 · 长按拖动排序
    </div>

  </div>
</div>

<div id="appActions" class="m-actions" style="display:none">
  <button class="btn btn-primary" id="mAdd">+ 添加自选</button>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA, wl = D.watchlist;
  var group = "all";
  var ticker = null;

  function rows() {
    return wl.items.filter(function (i) { return group === "all" || i.group === group; });
  }

  function render() {
    var list = rows();
    document.getElementById("mList").innerHTML = list.map(function (s) {
      var isUp = s.pct >= 0;
      return '<div class="wl-row" draggable="true" data-code="' + s.code + '">' +
        '<div class="wl-actions">' +
          '<div style="background:var(--brand)" class="actAlert" data-code="' + s.code + '">提醒</div>' +
          '<div style="background:var(--danger)" class="actDel" data-code="' + s.code + '">移除</div>' +
        "</div>" +
        '<div class="wl-inner">' +
          '<div class="grow" data-href="stock.html?code=' + s.code + '" style="min-width:0">' +
            '<div class="fs-14" style="font-weight:600">' + s.name + "</div>" +
            '<div class="row gap-2"><span class="mono fs-11 t-3">' + s.code + "</span>" +
            (s.alert ? '<span class="tag tag-brand">提醒</span>' : "") + "</div>" +
          "</div>" +
          '<div style="text-align:right;flex:0 0 auto;width:88px">' +
            '<div class="mono fs-15 fw-600" data-live data-price="' + s.price + '">' + s.price.toFixed(2) + "</div>" +
            '<div class="mono fs-12 ' + (isUp ? "t-up" : "t-down") + '" data-live-pct data-pct="' + s.pct + '">' + (isUp ? "+" : "") + s.pct.toFixed(2) + "%</div>" +
          "</div>" +
        "</div>" +
        "</div>";
    }).join("");

    /* 左滑 */
    SA.qsa(".wl-inner").forEach(function (inner) {
      var sx = 0, dx = 0, dragging = false;
      inner.addEventListener("touchstart", function (e) {
        sx = e.touches[0].clientX; dx = 0; dragging = true;
      }, { passive: true });
      inner.addEventListener("touchmove", function (e) {
        if (!dragging) return;
        dx = e.touches[0].clientX - sx;
        if (dx < 0 && dx > -140) inner.style.transform = "translateX(" + dx + "px)";
      }, { passive: true });
      inner.addEventListener("touchend", function () {
        dragging = false;
        inner.style.transform = dx < -60 ? "translateX(-136px)" : "";
      });
      /* 桌面端演示：双击行也可展开操作 */
      inner.addEventListener("dblclick", function () {
        inner.style.transform = inner.style.transform ? "" : "translateX(-136px)";
      });
    });

    SA.qsa(".actDel").forEach(function (b) {
      b.addEventListener("click", function () {
        var s = D.stockByCode[b.getAttribute("data-code")];
        SA.toast("已从自选移除：" + (s ? s.name : ""), "info");
        b.closest(".wl-row").remove();
      });
    });
    SA.qsa(".actAlert").forEach(function (b) {
      b.addEventListener("click", function () {
        SA.toast("已为该股票创建提醒规则", "ok");
      });
    });

    bindDrag();
  }

  function bindDrag() {
    var dragEl = null;
    SA.qsa(".wl-row").forEach(function (row) {
      row.addEventListener("dragstart", function () { dragEl = row; row.style.opacity = ".4"; });
      row.addEventListener("dragend", function () {
        row.style.opacity = "";
        if (dragEl && dragEl.parentNode) {
          var rowsArr = SA.qsa(".wl-row");
          rowsArr.forEach(function (r, i) { r.setAttribute("data-order", i); });
        }
        dragEl = null;
      });
      row.addEventListener("dragover", function (e) { if (dragEl && dragEl !== row) e.preventDefault(); });
      row.addEventListener("drop", function (e) {
        if (!dragEl || dragEl === row) return;
        e.preventDefault();
        var rect = row.getBoundingClientRect();
        var after = e.clientY > rect.top + rect.height / 2;
        row.parentNode.insertBefore(dragEl, after ? row.nextSibling : row);
      });
    });
  }

  SA.qsa("#mGroups > *").forEach(function (t) {
    t.addEventListener("click", function () {
      SA.qsa("#mGroups > *").forEach(function (o) {
        o.classList.toggle("tag-brand", o === t);
        o.classList.toggle("tag-outline", o !== t);
      });
      group = t.getAttribute("data-g");
      render();
    });
  });

  function startTicker() {
    return setInterval(function () {
      SA.qsa("[data-live]").forEach(function (el) {
        var base = parseFloat(el.getAttribute("data-price") || "0");
        if (!base) return;
        var drift = (Math.random() - 0.48) * base * 0.0018;
        var next = base + drift;
        el.setAttribute("data-price", next.toFixed(2));
        el.textContent = next.toFixed(2);
        el.classList.remove("flash-up", "flash-down");
        void el.offsetWidth;
        el.classList.add(drift >= 0 ? "flash-up" : "flash-down");
        var pctEl = el.parentNode.querySelector("[data-live-pct]");
        if (pctEl) {
          var pb = parseFloat(pctEl.getAttribute("data-pct") || "0");
          var np = pb + drift / base * 100;
          pctEl.setAttribute("data-pct", np.toFixed(2));
          pctEl.textContent = (np >= 0 ? "+" : "") + np.toFixed(2) + "%";
          pctEl.className = "mono fs-12 " + (np >= 0 ? "t-up" : "t-down");
        }
      });
    }, 3000);
  }

  document.getElementById("mPause").addEventListener("click", function () {
    if (ticker) {
      clearInterval(ticker); ticker = null;
      this.textContent = "▶";
      SA.toast("已暂停实时刷新", "warn");
    } else {
      ticker = startTicker();
      this.textContent = "⏸";
      SA.toast("已恢复实时刷新（3 秒）", "ok");
    }
  });

  document.getElementById("mAdd").addEventListener("click", function () {
    SA.toast("已打开发送搜索页，可搜索后加入自选", "info");
    setTimeout(function () { window.location.href = "search.html"; }, 450);
  });

  render();
  ticker = startTicker();
})();
</script>
</body>
</html>
