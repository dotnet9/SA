<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自选股 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .wl-row { display: flex; align-items: baseline; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--border-soft); }
  .wl-row:last-child { border-bottom: none; }
  .wl-row .nm { flex: 1; min-width: 0; }
  .wl-row .pc { width: 76px; text-align: right; }
</style>
</head>
<body data-page="watchlist" data-title="自选股" data-desc="名称 + 涨跌幅两列。点任一行进入个股页。">
<div id="appScreen">
  <div class="m-page">

    <div class="row-between">
      <div>
        <div style="font-size:22px;font-weight:700;letter-spacing:-0.01em">自选股</div>
        <div class="hint" style="margin-top:2px" id="wlCount"></div>
      </div>
      <button class="btn btn-outline btn-sm" id="btnAdd">+ 添加</button>
    </div>

    <div class="m-card is-flush" style="padding:0;margin-top:14px">
      <div id="wlList"></div>
    </div>

  </div>
</div>

<div class="overlay" id="dlgAdd">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="m-page">
      <div class="row-between">
        <span class="fs-15 fw-600">添加自选</span>
        <button class="icon-btn" data-close="dlgAdd">✕</button>
      </div>
      <input class="input" id="addKw" placeholder="代码 / 名称 / 拼音" style="margin-top:12px">
      <div id="addResult" class="col gap-2" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/spec.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA;
  var ORDER_KEY = "sa.watchorder";
  var defaults = D.watchlist.items.map(function (w) { return w.code; });

  var codes = (function () {
    var saved = SA.get(ORDER_KEY, "");
    if (!saved) return defaults.slice();
    var out = saved.split(",").filter(function (c) { return defaults.indexOf(c) >= 0; });
    defaults.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
    return out;
  })();

  function stockOf(code) {
    return (D.allStockByCode && D.allStockByCode[code]) || (D.stockByCode && D.stockByCode[code]) || null;
  }

  function render() {
    document.getElementById("wlCount").textContent = codes.length + " 只";

    if (!codes.length) {
      document.getElementById("wlList").innerHTML =
        '<div class="hint" style="padding:16px">还没有自选股</div>';
      return;
    }

    document.getElementById("wlList").innerHTML = codes.map(function (code) {
      var s = stockOf(code);
      var w = null;
      D.watchlist.items.forEach(function (x) { if (x.code === code) w = x; });
      var name = s ? s.name : (w ? w.name : code);
      var pct = s ? s.pct : (w ? w.pct : 0);
      var cls = pct >= 0 ? "t-up" : "t-down";
      return '<a class="wl-row" href="stock.html?code=' + code + '">' +
        '<span class="nm"><span class="fs-14">' + name + '</span>' +
          '<span class="mono fs-11 t-3" style="margin-left:6px">' + code + "</span></span>" +
        '<span class="mono fs-14 ' + cls + ' pc">' + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%</span>" +
      "</a>";
    }).join("");
  }

  var kw = document.getElementById("addKw");
  var result = document.getElementById("addResult");

  function search() {
    var k = kw.value.trim().toLowerCase();
    if (!k) { result.innerHTML = '<span class="hint">输入代码或名称开始搜索</span>'; return; }
    var hits = D.allStocks.filter(function (s) {
      return s.code.indexOf(k) >= 0 || s.name.toLowerCase().indexOf(k) >= 0 || (s.py || "").indexOf(k) >= 0;
    }).slice(0, 6);

    if (!hits.length) { result.innerHTML = '<span class="hint">没有匹配的股票</span>'; return; }

    result.innerHTML = hits.map(function (s) {
      var added = codes.indexOf(s.code) >= 0;
      return '<div class="row-between">' +
        '<span class="fs-13">' + s.name + ' <span class="mono fs-11 t-3">' + s.code + "</span></span>" +
        '<button class="btn btn-sm ' + (added ? "btn-ghost" : "btn-outline") + '" data-add="' + s.code + '"' +
          (added ? " disabled" : "") + ">" + (added ? "已加" : "加入") + "</button>" +
      "</div>";
    }).join("");
  }

  result.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-add]") : null;
    if (!btn) return;
    var code = btn.getAttribute("data-add");
    if (codes.indexOf(code) >= 0) return;
    codes.unshift(code);
    SA.set(ORDER_KEY, codes.join(","));
    render();
    search();
    SA.toast("已加入自选", "ok");
  });

  kw.addEventListener("input", search);
  document.getElementById("btnAdd").addEventListener("click", function () {
    SA.openDrawer("dlgAdd");
    kw.value = "";
    search();
  });

  render();
})();
</script>
</body>
</html>
