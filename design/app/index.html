<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .lg-wrap { padding: 16px 24px 24px; }
  .lg-logo {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--brand);
    display: grid; place-items: center; color: #fff;
    font-family: var(--font-num); font-weight: 700; font-size: 20px;
  }
  .role-chip {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    border-radius: 14px; background: var(--bg-panel);
    min-height: 60px;
  }
  [data-theme="light"] .role-chip { box-shadow: 0 1px 3px rgba(20, 22, 26, 0.05); }
  .role-chip.is-active { background: var(--brand-soft); }
  .role-chip.is-active .fs-13 { color: var(--brand); }
</style>
</head>
<body data-page="index" data-no-tabs data-title="登录" data-desc="大标题 + 演示角色选择 + 登录按钮。去掉一切与登录无关的内容，安装引导压缩为一行提示。">
<div id="appScreen">
  <div class="lg-wrap">
    <div class="row gap-3" style="margin-top:24px">
      <div class="lg-logo">SA</div>
      <div>
        <div style="font-size:20px;font-weight:700">股析</div>
        <div class="sa-brand-sub">Stock Analysis</div>
      </div>
    </div>

    <div style="margin-top:40px">
      <div style="font-size:26px;font-weight:700;line-height:1.4;letter-spacing:-0.01em">把一家公司<br>拆成一张矩阵</div>
      <div class="hint mt-3" style="line-height:1.9;font-size:13px">
        8 个维度拆解个股，四种拓扑图看清「谁影响谁」。
      </div>
    </div>

    <div class="m-section-title">选择演示角色</div>
    <div class="col gap-2">
      <div class="role-chip is-active" data-role="admin">
        <span class="avatar">管</span>
        <div class="grow"><div class="fs-14 fw-600">管理员</div><div class="hint">全部功能，含后台管理</div></div>
      </div>
      <div class="role-chip" data-role="user">
        <span class="avatar">用</span>
        <div class="grow"><div class="fs-14 fw-600">普通用户</div><div class="hint">分析 + 自选 + 提醒</div></div>
      </div>
      <div class="role-chip" data-role="guest">
        <span class="avatar">访</span>
        <div class="grow"><div class="fs-14 fw-600">访客</div><div class="hint">仅市场与搜索</div></div>
      </div>
    </div>

    <div class="col gap-3" style="margin-top:20px">
      <div class="field"><label class="label">用户名</label>
        <input class="input is-mono tap-44" id="mUser" value="admin"></div>
      <div class="field"><label class="label">密码</label>
        <input class="input is-mono tap-44" id="mPass" type="password" value="admin123"></div>
    </div>

    <div class="hint" style="margin-top:24px;line-height:1.9">
      演示数据 · 不校验真实密码 · iOS 可「添加到主屏幕」获得原生体验
    </div>
  </div>
</div>

<div id="appActions" class="m-actions" style="display:none">
  <button class="btn btn-primary" id="mLogin">登录</button>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var selected = "admin";
  SA.qsa(".role-chip").forEach(function (c) {
    c.addEventListener("click", function () {
      SA.qsa(".role-chip").forEach(function (o) { o.classList.remove("is-active"); });
      c.classList.add("is-active");
      selected = c.getAttribute("data-role");
      document.getElementById("mUser").value = selected;
      document.getElementById("mPass").value = selected === "admin" ? "admin123" : selected === "user" ? "user123" : "guest123";
    });
  });
  document.getElementById("mLogin").addEventListener("click", function () {
    SA.setRole(selected);
    SA.toast("已以「" + SA.currentRole().name + "」身份登录", "ok");
    setTimeout(function () {
      window.location.href = selected === "admin" ? "settings.html" : "home.html";
    }, 450);
  });
})();
</script>
</body>
</html>
