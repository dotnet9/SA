<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条件选股器 · 股析 SA（移动端）</title>
<link rel="stylesheet" href="../web/_shared/tokens.css">
<link rel="stylesheet" href="../web/_shared/tailwind.css">
<link rel="stylesheet" href="../web/_shared/components.css">
<style>
  .preset-chip {
    flex: 0 0 auto; padding: 9px 14px; border-radius: 12px;
    background: var(--bg-panel);
    font-size: 13px; white-space: nowrap;
  }
  [data-theme="light"] .preset-chip { box-shadow: 0 1px 3px rgba(20, 22, 26, 0.05); }
  .preset-chip.is-active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
</style>
</head>
<body data-page="screener" data-title="条件选股器" data-desc="预设策略横滑、条件气泡可删、大字命中数、结果列表与筛选漏斗。条件编辑收进底部抽屉，散点分布移至 Web 端。">
<div id="appScreen">

  <div class="m-topbar">
    <span class="m-title">选股</span>
    <span class="fs-12 t-3" style="margin-left:auto" id="mHits">命中 64 只</span>
    <button class="icon-btn" data-open="sheetCond">⚙</button>
  </div>

  <div class="m-page">

    <!-- 预设策略横滑 -->
    <div class="m-scroll-x" id="mPresets" style="margin-top:4px"></div>

    <!-- 已选条件 -->
    <div class="row gap-2 wrap" style="margin-top:14px" id="mConds"></div>
    <button class="btn btn-outline btn-block mt-3" data-open="sheetCond">+ 添加 / 修改条件</button>

    <!-- 命中数 -->
    <div class="m-card" style="margin-top:16px">
      <div class="hint">预计命中</div>
      <div class="mono fw-700 t-brand" style="font-size:40px;line-height:1.2;letter-spacing:-0.02em" id="mHitBig">64</div>
      <div class="hint">占全市场 1.18%</div>
    </div>

    <!-- 结果列表 -->
    <div class="m-section-title">
      命中股票
      <span class="fs-11 t-3" style="margin-left:auto">按综合评分</span>
    </div>
    <div class="m-card" style="padding:0 16px" id="mResults"></div>

    <!-- 筛选日志 -->
    <div class="m-section-title">筛选过程</div>
    <div class="m-card">
      <div class="col gap-2">
        <div class="row-between"><span class="fs-13 t-2">0. 全市场初始集</span><span class="mono fs-13">5,428</span></div>
        <div class="row-between"><span class="fs-13 t-2">1. 总市值 ≥ 100 亿</span><span class="mono fs-13">1,842</span></div>
        <div class="row-between"><span class="fs-13 t-2">2. PE ≤ 25</span><span class="mono fs-13">862</span></div>
        <div class="row-between"><span class="fs-13 t-2">3. ROE ≥ 15%</span><span class="mono fs-13">186</span></div>
        <div class="row-between"><span class="fs-13 t-2">4. 净利增速 ≥ 20%</span><span class="mono fs-13 t-brand fw-600">64</span></div>
      </div>
    </div>

    <div class="hint" style="margin-top:20px;line-height:1.8">
      基于每日收盘后快照 · 演示数据 · 不构成投资建议
    </div>

  </div>
</div>

<div id="appActions" class="m-actions" style="display:none">
  <button class="btn btn-outline" id="mSave">保存策略</button>
  <button class="btn btn-primary" id="mAddAll">全部加自选</button>
</div>

<!-- 条件抽屉 -->
<div class="sheet" id="sheetCond">
  <div class="sheet-grip"></div>
  <div class="row-between" style="margin-bottom:12px">
    <span class="fs-16 fw-600">筛选条件</span>
    <div class="row gap-2">
      <button class="btn btn-sm btn-ghost" id="mClear">清空</button>
      <button class="icon-btn" data-close="sheetCond">✕</button>
    </div>
  </div>

  <div class="col gap-3" id="condGroups"></div>

  <button class="btn btn-primary btn-block mt-4" data-close="sheetCond" id="mRun">执行筛选（预计 64 只）</button>
</div>

<script src="../web/_shared/vendor/echarts.min.js"></script>
<script src="../web/_shared/data.js"></script>
<script src="../web/_shared/charts.js"></script>
<script src="../web/_shared/app.js"></script>
<script src="../web/_shared/mock-frame.js"></script>
<script>
(function () {
  var D = window.SA_DATA, C = window.SA_CHARTS, F = C.F, sc = D.screener;

  /* 预设横滑 */
  document.getElementById("mPresets").innerHTML = sc.presets.map(function (p, i) {
    return '<div class="preset-chip' + (i === 0 ? " is-active" : "") + '" data-id="' + p.id + '">' +
      p.name + ' <span class="mono fs-11 t-3">' + p.hits + "</span></div>";
  }).join("");
  SA.qsa(".preset-chip").forEach(function (c) {
    c.addEventListener("click", function () {
      SA.qsa(".preset-chip").forEach(function (o) { o.classList.remove("is-active"); });
      c.classList.add("is-active");
      var p = sc.presets.filter(function (x) { return x.id === c.getAttribute("data-id"); })[0];
      document.getElementById("mHitBig").textContent = p.hits;
      document.getElementById("mHits").textContent = "命中 " + p.hits + " 只";
      SA.toast("已套用：「" + p.name + "」，命中 " + p.hits + " 只", "ok");
    });
  });

  /* 已选条件气泡 */
  function renderConds() {
    document.getElementById("mConds").innerHTML = sc.activeConds.map(function (c, i) {
      return '<span class="cond-chip">' + c.label + ' <span class="x" data-i="' + i + '">✕</span></span>';
    }).join("");
    SA.qsa("#mConds .x").forEach(function (x) {
      x.addEventListener("click", function () {
        x.parentNode.remove();
        SA.toast("已移除条件，命中数将随之变化", "info");
      });
    });
  }
  renderConds();

  /* 条件分组 */
  document.getElementById("condGroups").innerHTML = sc.groups.map(function (g) {
    return '<div class="fold' + (g.open ? "" : " is-collapsed") + '">' +
      '<div class="fold-head"><span class="fs-13 fw-600">' + g.name + "</span>" +
      '<span class="hint" style="margin-left:auto">' + g.conds.length + " 项</span>" +
      '<span class="caret">▼</span></div>' +
      '<div class="fold-body col gap-2">' +
        g.conds.map(function (c) {
          if (c.select) {
            return '<div class="field"><label class="label">' + c.name + "</label>" +
              '<select class="select input-sm">' + c.select.map(function (o) { return "<option>" + o + "</option>"; }).join("") + "</select></div>";
          }
          return '<div class="field"><label class="label">' + c.name + (c.unit ? "（" + c.unit + "）" : "") + "</label>" +
            '<div class="row gap-2">' +
              '<input class="input input-sm input-num" value="' + c.min + '" placeholder="下限">' +
              '<span class="hint">~</span>' +
              '<input class="input input-sm input-num" value="' + c.max + '" placeholder="上限">' +
            "</div></div>";
        }).join("") +
      "</div></div>";
  }).join("");

  SA.qsa(".fold-head").forEach(function (h) {
    h.addEventListener("click", function () { h.parentNode.classList.toggle("is-collapsed"); });
  });

  document.getElementById("mClear").addEventListener("click", function () {
    document.getElementById("mConds").innerHTML = "";
    document.getElementById("mHitBig").textContent = "5428";
    SA.toast("已清空全部条件", "info");
  });
  document.getElementById("mRun").addEventListener("click", function () {
    SA.toast("筛选完成：命中 " + sc.results.length + " 只（演示结果集）", "ok");
  });

  /* 结果列表 */
  document.getElementById("mResults").innerHTML = sc.results.slice().sort(function (a, b) { return b.score - a.score; }).slice(0, 10).map(function (r) {
    return '<div class="m-list-row" data-href="stock.html?code=' + r.code + '">' +
      '<div class="grow" style="min-width:0">' +
        '<div class="fs-14" style="font-weight:600">' + r.name + "</div>" +
        '<div class="hint">' + r.industry + " · PE " + r.pe.toFixed(1) + " · ROE " + r.roe.toFixed(1) + "%</div>" +
      "</div>" +
      '<div style="text-align:right;flex:0 0 auto;width:88px">' +
        '<div class="mono fs-14 fw-600 ' + (r.pct >= 0 ? "t-up" : "t-down") + '">' + r.price.toFixed(2) + "</div>" +
        '<div class="mono fs-12 ' + (r.pct >= 0 ? "t-up" : "t-down") + '">' + (r.pct >= 0 ? "+" : "") + r.pct.toFixed(2) + "%</div>" +
      "</div>" +
      '<div style="text-align:right;flex:0 0 auto;width:40px">' +
        '<div class="mono fs-14 fw-700 ' + (r.score >= 85 ? "t-up" : "") + '">' + r.score + "</div>" +
        '<div class="fs-10 t-3">评分</div>' +
      "</div>" +
      "</div>";
  }).join("");

  document.getElementById("mAddAll").addEventListener("click", function () {
    SA.toast("已将 12 只命中股票加入自选股", "ok");
  });
  document.getElementById("mSave").addEventListener("click", function () {
    SA.toast("已保存为「我的策略：低估值高 ROE v2」", "ok");
  });
})();
</script>
</body>
</html>
