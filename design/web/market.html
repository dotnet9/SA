<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大盘概况 · 股析 SA</title>
<link rel="stylesheet" href="_shared/tokens.css">
<link rel="stylesheet" href="_shared/tailwind.css">
<link rel="stylesheet" href="_shared/components.css">
</head>
<body data-page="market">

<div class="sa-app">
  <div class="sa-brand">
    <div class="sa-logo">SA</div>
    <div class="sa-brand-text">
      <div class="sa-brand-name">股析</div>
      <div class="sa-brand-sub">Stock Analysis</div>
    </div>
  </div>
  <header class="sa-topbar" id="saTop"></header>
  <nav class="sa-sidenav" id="saNav"></nav>
  <main class="sa-main">
    <div class="sa-page is-wide">

      <!-- 指数横条：单行五格，只放 名称 / 点位 / 涨跌幅 -->
      <div class="index-strip" id="indexStrip"></div>

      <!-- 个股区：点表格任一行后接管右侧（列表隐起），带返回列表 -->
      <div class="stock-pane" id="stockPane"></div>

      <!-- 全市场表：本页主角 -->
      <div id="marketList">
        <div class="card">
          <div class="card-head">
            <span class="card-title">全市场</span>
            <span class="card-sub" id="marketCount">—</span>
            <div class="card-tools">
              <span class="segmented" id="boardSeg">
                <span class="is-active" data-board="">全部</span>
                <span data-board="沪市主板">沪市</span>
                <span data-board="深市主板">深市</span>
                <span data-board="创业板">创业板</span>
                <span data-board="科创板">科创板</span>
                <span data-board="北交所">北交所</span>
              </span>
              <input class="input input-sm" id="marketFilter" type="search" placeholder="搜索代码 / 名称 / 拼音" style="width:190px">
            </div>
          </div>
          <div class="card-body is-flush">
            <div class="tbl-wrap">
              <table class="tbl market-table" id="marketTable">
                <thead>
                  <tr>
                    <th class="is-sortable">名称 / 代码 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">现价 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">涨跌幅 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">换手率 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">量比 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">成交额 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">总市值 <span class="sort-caret">▼</span></th>
                    <th class="num is-sortable">PE <span class="sort-caret">▼</span></th>
                    <th>行业</th>
                  </tr>
                </thead>
                <tbody id="marketBody"></tbody>
              </table>
            </div>
          </div>
          <div class="card-foot row-between" id="marketPager"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="_shared/vendor/echarts.min.js"></script>
<script src="_shared/data.js"></script>
<script src="_shared/charts.js"></script>
<script src="_shared/spec.js"></script>
<script src="_shared/app.js"></script>
<script src="_shared/stock-panels.js"></script>
<script src="_shared/panels/overview.js"></script>
<script>
(function () {
  var D = window.SA_DATA;

  /* ---------- 指数横条 ---------- */
  document.getElementById("indexStrip").innerHTML = D.indices.map(function (ix) {
    var cls = ix.pct >= 0 ? "is-up" : "is-down";
    return '<div class="index-strip-cell">' +
      '<span class="index-strip-name">' + ix.name + "</span>" +
      '<span class="index-strip-value mono ' + cls + '">' + ix.price.toFixed(2) + "</span>" +
      '<span class="index-strip-pct mono ' + cls + '">' +
        (ix.pct >= 0 ? "+" : "") + ix.pct.toFixed(2) + "%" +
      "</span>" +
    "</div>";
  }).join("");

  /* ---------- 全市场表 ---------- */
  var PAGE_SIZE = 60;
  var state = { board: "", keyword: "", page: 1 };

  function rows() {
    var kw = state.keyword.trim().toLowerCase();
    return D.allStocks.filter(function (s) {
      if (state.board && s.board !== state.board) return false;
      if (!kw) return true;
      return s.code.indexOf(kw) >= 0 ||
        s.name.toLowerCase().indexOf(kw) >= 0 ||
        (s.py || "").indexOf(kw) >= 0;
    });
  }

  function render() {
    var list = rows();
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * PAGE_SIZE;
    var pageRows = list.slice(start, start + PAGE_SIZE);

    document.getElementById("marketCount").textContent =
      "共 " + list.length + " 只" + (state.board ? " · " + state.board : "");

    document.getElementById("marketBody").innerHTML = pageRows.map(function (s) {
      var cls = s.pct >= 0 ? "is-up" : "is-down";
      var amount = (s.cap * s.turnover / 100).toFixed(1);
      return '<tr data-code="' + s.code + '">' +
        '<td><span class="stock-cell"><span class="sc-name">' + s.name + '</span>' +
          '<span class="sc-code">' + s.code + "</span></span></td>" +
        '<td class="num mono">' + s.price.toFixed(2) + "</td>" +
        '<td class="num mono ' + cls + '">' + (s.pct >= 0 ? "+" : "") + s.pct.toFixed(2) + "%</td>" +
        '<td class="num mono">' + s.turnover.toFixed(2) + "%</td>" +
        '<td class="num mono">' + s.volRatio.toFixed(2) + "</td>" +
        '<td class="num mono">' + amount + "</td>" +
        '<td class="num mono">' + s.cap.toLocaleString() + "</td>" +
        '<td class="num mono">' + (s.pe > 0 ? s.pe.toFixed(1) : "—") + "</td>" +
        '<td class="fs-11 t-2">' + s.industry + "</td>" +
      "</tr>";
    }).join("");

    document.getElementById("marketPager").innerHTML =
      '<span class="fs-11 t-3">第 ' + state.page + " / " + pages + " 页</span>" +
      '<span class="row gap-2">' +
        '<button class="btn btn-outline btn-sm" id="pgPrev"' + (state.page <= 1 ? " disabled" : "") + ">上一页</button>" +
        '<button class="btn btn-outline btn-sm" id="pgNext"' + (state.page >= pages ? " disabled" : "") + ">下一页</button>" +
      "</span>";

    var prev = document.getElementById("pgPrev");
    var next = document.getElementById("pgNext");
    if (prev) prev.addEventListener("click", function () { state.page--; render(); });
    if (next) next.addEventListener("click", function () { state.page++; render(); });
  }

  /* 行点击 → 打开个股区（右侧整块替换列表） */
  document.getElementById("marketBody").addEventListener("click", function (e) {
    var tr = e.target.closest ? e.target.closest("tr[data-code]") : null;
    if (tr) window.SA_PANE.open(tr.getAttribute("data-code"), "overview");
  });

  document.getElementById("boardSeg").addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-board]") : null;
    if (!el) return;
    Array.prototype.forEach.call(this.children, function (o) { o.classList.remove("is-active"); });
    el.classList.add("is-active");
    state.board = el.getAttribute("data-board");
    state.page = 1;
    render();
  });

  document.getElementById("marketFilter").addEventListener("input", function () {
    state.keyword = this.value;
    state.page = 1;
    render();
  });

  render();

  /* 表头排序：表头元素不随翻页重建，因此只绑定一次。
     重复调用 SA.bindTables 会往同一批 th 上叠加监听，点一次触发多次排序。 */
  SA.bindTables(document.getElementById("marketTable"));

  /* ---------- 个股区 ---------- */
  window.SA_PANE.mount("#stockPane", "#marketList");
  window.SA_PANE.restoreFromUrl();
})();
</script>
</body>
</html>
