<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-updown="red-up">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自选股 · 股析 SA</title>
<link rel="stylesheet" href="_shared/tokens.css">
<link rel="stylesheet" href="_shared/tailwind.css">
<link rel="stylesheet" href="_shared/components.css">
</head>
<body data-page="watchlist">

<div class="sa-app">
  <div class="sa-brand">
    <div class="sa-logo">SA</div>
    <div class="sa-brand-text">
      <div class="sa-brand-name">股析</div>
      <div class="sa-brand-sub">Stock Analysis</div>
    </div>
  </div>
  <header class="sa-topbar" id="saTop"></header>
  <nav class="sa-sidenav" id="saNav"></nav>
  <main class="sa-main">
    <div class="sa-page is-wide">

      <!-- 个股区：点自选任一行后接管右侧（列表隐起），带返回列表 -->
      <div class="stock-pane" id="stockPane"></div>

      <!-- 自选列表：名称 + 涨跌幅两列 -->
      <div id="watchList">
        <div class="card">
          <div class="card-head">
            <span class="card-title">自选股</span>
            <span class="card-sub" id="watchCount">—</span>
            <div class="card-tools">
              <button class="btn btn-outline btn-sm" id="btnAddWatch">+ 添加自选</button>
            </div>
          </div>
          <div class="card-body is-flush">
            <div class="tbl-wrap">
              <table class="tbl">
                <thead>
                  <tr>
                    <th>名称</th>
                    <th class="num" style="width:130px">涨跌幅</th>
                    <th class="col-actions" style="width:80px"></th>
                  </tr>
                </thead>
                <tbody id="watchBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- 添加自选：只留 搜索 + 加入 -->
<div class="overlay" id="dlgAdd">
  <div class="dialog">
    <div class="dialog-head">
      <h3>添加自选</h3>
      <button class="icon-btn" data-close="dlgAdd" style="margin-left:auto">✕</button>
    </div>
    <div class="dialog-body col gap-4">
      <div class="field">
        <label class="label">搜索股票</label>
        <input class="input" id="addKw" placeholder="输入代码 / 名称 / 拼音首字母，如 300750、宁德时代、ndsd">
      </div>
      <div id="addResult" class="col gap-2"></div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" data-close="dlgAdd">关闭</button>
    </div>
  </div>
</div>

<script src="_shared/vendor/echarts.min.js"></script>
<script src="_shared/data.js"></script>
<script src="_shared/charts.js"></script>
<script src="_shared/spec.js"></script>
<script src="_shared/app.js"></script>
<script src="_shared/stock-panels.js"></script>
<script src="_shared/panels/overview.js"></script>
<script src="_shared/panels/trend.js"></script>
<script src="_shared/panels/finance.js"></script>
<script src="_shared/panels/equity.js"></script>
<script src="_shared/panels/capital.js"></script>
<script src="_shared/panels/industry.js"></script>
<script src="_shared/panels/events.js"></script>
<script src="_shared/panels/risk.js"></script>
<script src="_shared/panels/rating.js"></script>
<script>
(function () {
  var D = window.SA_DATA;

  /* 自选顺序存本机（与 app.js 的 sa.cardorder 同机制） */
  var ORDER_KEY = "sa.watchorder";
  var defaultCodes = D.watchlist.items.map(function (w) { return w.code; });

  var codes = (function () {
    var saved = SA.get(ORDER_KEY, "");
    if (!saved) return defaultCodes.slice();
    var out = saved.split(",").filter(function (c) { return defaultCodes.indexOf(c) >= 0; });
    defaultCodes.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
    return out;
  })();

  function stockOf(code) {
    return (D.allStockByCode && D.allStockByCode[code]) ||
           (D.stockByCode && D.stockByCode[code]) || null;
  }

  function save() { SA.set(ORDER_KEY, codes.join(",")); }

  function render() {
    document.getElementById("watchCount").textContent = codes.length + " 只";

    if (!codes.length) {
      document.getElementById("watchBody").innerHTML =
        '<tr><td colspan="3" class="fs-12 t-3" style="padding:16px">还没有自选股，点右上角「+ 添加自选」</td></tr>';
      return;
    }

    document.getElementById("watchBody").innerHTML = codes.map(function (code) {
      var s = stockOf(code);
      var w = null;
      D.watchlist.items.forEach(function (x) { if (x.code === code) w = x; });
      var name = s ? s.name : (w ? w.name : code);
      var pct = s ? s.pct : (w ? w.pct : 0);
      var cls = pct >= 0 ? "is-up" : "is-down";
      return '<tr data-code="' + code + '">' +
        '<td><span class="stock-cell"><span class="sc-name">' + name + '</span>' +
          '<span class="sc-code">' + code + "</span></span></td>" +
        '<td class="num mono fs-14 ' + cls + '">' + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%</td>" +
        '<td class="col-actions"><button class="btn btn-sm btn-ghost" data-del="' + code + '">移除</button></td>' +
      "</tr>";
    }).join("");
  }

  /* 行点击 → 打开个股区；点「移除」不触发打开 */
  document.getElementById("watchBody").addEventListener("click", function (e) {
    var del = e.target.closest ? e.target.closest("[data-del]") : null;
    if (del) {
      var code = del.getAttribute("data-del");
      codes = codes.filter(function (c) { return c !== code; });
      save();
      render();
      SA.toast("已从自选股移除", "info");
      return;
    }
    var tr = e.target.closest ? e.target.closest("tr[data-code]") : null;
    if (tr) window.SA_PANE.open(tr.getAttribute("data-code"), "overview");
  });

  /* ---------- 添加自选 ---------- */
  var kw = document.getElementById("addKw");
  var result = document.getElementById("addResult");

  function search() {
    var k = kw.value.trim().toLowerCase();
    if (!k) { result.innerHTML = '<span class="fs-12 t-3">输入代码或名称开始搜索</span>'; return; }

    var hits = D.allStocks.filter(function (s) {
      return s.code.indexOf(k) >= 0 || s.name.toLowerCase().indexOf(k) >= 0 || (s.py || "").indexOf(k) >= 0;
    }).slice(0, 8);

    if (!hits.length) { result.innerHTML = '<span class="fs-12 t-3">没有匹配的股票</span>'; return; }

    result.innerHTML = hits.map(function (s) {
      var added = codes.indexOf(s.code) >= 0;
      return '<div class="row-between" style="padding:6px 0">' +
        '<span class="stock-cell"><span class="sc-name">' + s.name + '</span>' +
          '<span class="sc-code">' + s.code + " · " + s.board + "</span></span>" +
        '<button class="btn btn-sm ' + (added ? "btn-ghost" : "btn-outline") + '" data-add="' + s.code + '"' +
          (added ? " disabled" : "") + ">" + (added ? "已在自选" : "加入") + "</button>" +
      "</div>";
    }).join("");
  }

  result.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-add]") : null;
    if (!btn) return;
    var code = btn.getAttribute("data-add");
    if (codes.indexOf(code) >= 0) return;
    codes.unshift(code);
    save();
    render();
    search();
    SA.toast("已加入自选", "ok");
  });

  kw.addEventListener("input", search);
  document.getElementById("btnAddWatch").addEventListener("click", function () {
    SA.openDialog("dlgAdd");
    kw.value = "";
    search();
    kw.focus();
  });

  render();

  /* ---------- 个股区 ---------- */
  window.SA_PANE.mount("#stockPane", "#watchList");
  window.SA_PANE.restoreFromUrl();
})();
</script>
</body>
</html>
